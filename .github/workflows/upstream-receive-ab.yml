name: Upstream UDP batch A-B
on:
  pull_request:
    branches: [claude/busy-dirac-h0au33]
    paths: [.github/workflows/upstream-receive-ab.yml]
permissions:
  contents: read
jobs:
  benchmark:
    if: github.event.pull_request.head.ref == 'codex/pathdns-upstream-receive-reuse'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build PathDNS baseline and prototype
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/reuse-target"
          git worktree add --detach "$RUNNER_TEMP/reuse-base" ad730c85a79cfe81b7bba6060e7c0e14e12dff67
          cd "$RUNNER_TEMP/reuse-base"
          cargo build --locked --release --no-default-features
          cp "$CARGO_TARGET_DIR/release/pathdns" "$RUNNER_TEMP/pathdns-base"
          cd "$GITHUB_WORKSPACE"
          cargo build --locked --release --no-default-features
          cp "$CARGO_TARGET_DIR/release/pathdns" "$RUNNER_TEMP/pathdns-shared"
          rustc -O testing/benchmark/loadbench.rs -o "$RUNNER_TEMP/reuse-load"
          rustc -O testing/benchmark/rustmock.rs -o "$RUNNER_TEMP/reuse-mock"
          uname -m
          wc -c "$RUNNER_TEMP/pathdns-base" "$RUNNER_TEMP/pathdns-shared"
      - name: Compare loopback throughput and memory
        run: python3 testing/benchmark/reuse_validation.py
